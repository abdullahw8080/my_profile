        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id') || 1;
        window.project = projectData[projectId];
        var project = window.project;

        if (project) {
            document.getElementById('project-title').innerText = (currentLang === 'en' && project.titleEn) ? project.titleEn : project.title;
            
            const descHtmlKey = (currentLang === 'en') ? 'descriptionHtmlEn' : 'descriptionHtml';
            const descKey = (currentLang === 'en') ? 'descriptionEn' : 'description';
            const projectDescEl = document.getElementById('project-description');
            
            if (project[descHtmlKey] || project.descriptionHtml) {
                projectDescEl.innerHTML = project[descHtmlKey] || project.descriptionHtml;
            } else {
                projectDescEl.innerText = project[descKey] || project.description;
            }

            document.getElementById('project-client').innerText = (currentLang === 'en' && project.clientEn) ? project.clientEn : project.client;
            document.getElementById('project-date').innerText = project.date;
            document.getElementById('project-stack').innerText = (currentLang === 'en' && project.stackEn) ? project.stackEn : project.stack;
            document.getElementById('project-github').href = project.github;

            const tagsPath = document.getElementById('project-tags');
            project.tags.forEach(t => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = t;
                tagsPath.appendChild(span);
            });

            const galleryTop = document.getElementById('project-gallery-top');
            const galleryThumbs = document.getElementById('project-gallery-thumbs');

            project.images.forEach(img => {
                // Main Slide
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `<img src="${img}" alt="Project Image" loading="lazy" decoding="async" onclick="openLightbox(this.src)">`;
                galleryTop.appendChild(slide);

                // Thumb Slide
                const thumb = document.createElement('div');
                thumb.className = 'swiper-slide';
                thumb.innerHTML = `<img src="${img}" alt="Thumb" loading="lazy" decoding="async">`;
                galleryThumbs.appendChild(thumb);
            });

            // Function to update hidden images indicator
            function updateHiddenImagesIndicator() {
                const totalImages = project.images.length;
                let slidesPerView = 6; // Default desktop

                // Check breakpoints manualy to match Swiper config
                if (window.innerWidth < 640) {
                    slidesPerView = 4;
                } else if (window.innerWidth < 1024) {
                    slidesPerView = 5;
                }

                // Remove existing overlays
                document.querySelectorAll('.more-images-overlay').forEach(el => el.remove());

                if (totalImages > slidesPerView) {
                    const hiddenCount = totalImages - slidesPerView;
                    const thumbSlides = galleryThumbs.querySelectorAll('.swiper-slide');
                    if (thumbSlides[slidesPerView - 1]) {
                        const overlay = document.createElement('div');
                        overlay.className = 'more-images-overlay';
                        overlay.innerText = '+' + hiddenCount;
                        thumbSlides[slidesPerView - 1].appendChild(overlay);
                    }
                }
            }

            // Initialize Thumbs Swiper
            var swiperThumbs = new Swiper(".gallery-thumbs", {
                spaceBetween: 10,
                slidesPerView: 6, // Increased to make thumbnails smaller
                freeMode: true,
                watchSlidesProgress: true,
                pagination: {
                    el: ".swiper-pagination",
                    type: "fraction",
                },
                breakpoints: {
                    320: {
                        slidesPerView: 4,
                        spaceBetween: 5
                    },
                    640: {
                        slidesPerView: 5,
                        spaceBetween: 8
                    },
                    1024: {
                        slidesPerView: 6,
                        spaceBetween: 10
                    }
                },
                on: {
                    init: function () {
                        setTimeout(updateHiddenImagesIndicator, 100);
                    },
                    resize: function () {
                        setTimeout(updateHiddenImagesIndicator, 100);
                    }
                }
            });

            // Initialize Main Swiper linked to Thumbs
            var swiperTop = new Swiper(".gallery-top", {
                spaceBetween: 10,
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                thumbs: {
                    swiper: swiperThumbs,
                },
                autoplay: { delay: 3000 },
                loop: true
            });
        }

        // Lightbox Functions
        const modal = document.getElementById("lightbox-modal");
        const modalImg = document.getElementById("lightbox-img");
        const closeBtn = document.getElementsByClassName("close-lightbox")[0];

        function openLightbox(src) {
            modal.style.display = "flex";
            modalImg.src = src;
        }

        closeBtn.onclick = function () {
            modal.style.display = "none";
        }

        modal.onclick = function (e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

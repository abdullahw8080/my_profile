<h3>🛠️ وظائف وميزات النظام</h3>

<h4>1. واجهة العميل (Storefront)</h4>
<ul>
    <li><strong>القائمة الرئيسية والأقسام:</strong> تصفح المنتجات عبر الأقسام المختلفة مثل الفواكه، الخضروات، المواد الغذائية، مستلزمات الأطفال، المياه والمشروبات، المواد المنزلية والتنظيف، البهارات، وقسم الجملة.</li>
    <li><strong>البحث المتقدم:</strong> شريط بحث ذكي يبحث في عناوين وأوصاف المنتجات للوصول السريع.</li>
    <li><strong>التحكم بالكميات:</strong> أزرار تفاعلية (<code>+</code> و <code>-</code>) تظهر عند الضغط على المنتج لتعديل الكمية المطلوبة بشكل مباشر دون الحاجة للانتقال لصفحة أخرى.</li>
    <li><strong>سلة تسوق تفاعلية:</strong> تعرض المنتجات المضافة وسعر كل منها والمجموع النهائي مع إمكانية تحديث الكمية أو حذف المنتج فورياً.</li>
    <li><strong>نظام الحسابات والأمان:</strong> تسجيل حساب جديد، تسجيل الدخول الآمن، والتحقق من صلاحية الجلسة لمنع الوصول غير المصرح به للملفات.</li>
</ul>

<h4>2. لوحة التحكم للمسؤولين (Admin Panel)</h4>
<ul>
    <li><strong>إحصائيات فورية:</strong> إشعار الإدارة فوراً بعدد الطلبات المعلقة غير المعالجة والرسائل الجديدة الواردة من العملاء.</li>
    <li><strong>إدارة المنتجات والأقسام:</strong> إضافة منتج جديد (الاسم، السعر الأصلي والجديد، الكمية، القسم، الصورة، الوزن، وحدة البيع)، تعديل وحذف المنتجات وتحديث المخزون، وإضافة أقسام جديدة وصورها.</li>
    <li><strong>إدارة الطلبات والعملاء:</strong> استعراض تفاصيل طلب المشتري (الاسم، الهاتف، العنوان بالتفصيل، المنتجات المطلوبة وكمياتها، والسعر الإجمالي) واتخاذ إجراء القبول (Confirm) أو الرفض (Reject).</li>
</ul>

<h4>3. محرك التقارير الذكي والمتقدم (Advanced Reporting Engine)</h4>
<p>
تتميز لوحة التحكم بنظام تقارير إدارية متكامل يساعد على اتخاذ القرارات التجارية الصائبة:
</p>
<ul>
    <li><strong>تقرير المنتجات الأكثر مبيعاً:</strong> يوضح السلع الأكثر طلباً وربحية لزيادة المعروض منها.</li>
    <li><strong>تقرير المبيعات اليومية:</strong> يعرض كشفاً تفصيلياً بالمبيعات اليومية ومقارنتها بالتواريخ السابقة وتتبع نمو المتجر.</li>
    <li><strong>تقرير المخزون والمنتجات:</strong> يوفر إشرافاً دقيقاً على حالة المستودع والكميات المتبقية للسلع لتجنب نفاد المخزون.</li>
    <li><strong>تقرير الطلبات المعلقة:</strong> تتبع مستمر للطلبات التي لم تُشحن بعد لضمان سرعة التوصيل.</li>
    <li><strong>تقرير المنتجات الراكدة (Slow Moving Items):</strong> جرد بالمنتجات ذات الإقبال الضعيف لعمل عروض ترويجية وتخفيضات للتخلص منها قبل انتهاء صلاحيتها.</li>
    <li><strong>تقرير المناطق الأكثر شراءً:</strong> يحلل التوزيع الجغرافي للمشترين لتحديد الأحياء والمناطق الأكثر ربحية وتوجيه سيارات التوصيل إليها.</li>
    <li><strong>تقرير العملاء الأكثر شراءً:</strong> قائمة بالعملاء الأكثر تفاعلاً وولاءً للمتجر لتقديم مكافآت أو خصومات خاصة لهم.</li>
</ul>

    <li><strong>JavaScript (Vanilla JS):</strong> لإضافة التفاعل مثل تعديل كميات السلال، إظهار وإخفاء القوائم الجانبية للهاتف، والبحث السريع.</li>
    <li><strong>Swiper JS:</strong> لتنفيذ سلايدر العروض الترويجية والمنتجات بشكل انسيابي وجذاب في الواجهة الرئيسية.</li>
    <li><strong>Font Awesome & Boxicons:</strong> لتوفير مكتبة غنية من الأيقونات الرمزية التوضيحية لسهولة التصفح.</li>
    <li><strong>Google Fonts (Cairo):</strong> استخدام خط "Cairo" العربي الأنيق المعتمد في أفضل التصاميم العربية الحديثة لضمان مقروئية ممتازة.</li>

<ul>
    <li><strong>Digitizing the Events Sector:</strong> Transforming the traditional hall-searching process into an interactive digital experience at the touch of a button.</li>

    <li><strong>Organizing Bookings:</strong> Preventing booking conflicts and ensuring real-time synchronization of available dates.</li>
    <li><strong>Supporting Entrepreneurship:</strong> Enabling hall owners and service providers to reach a wider client base and manage their business efficiently.</li>
    <li><strong>Service Integration:</strong> A complete booking experience including halls and complementary services (photography, decor, catering).</li>
</ul>

<h3>⚠️ The Problem Solved</h3>
<ul>
    <li><strong>Wasted Time & Effort:</strong> The need to visit dozens of halls in person to check prices and available dates.</li>
    <li><strong>Price Inconsistency:</strong> Lack of clear pricing standards and unjustified price variations across venues.</li>
    <li><strong>Booking Conflicts:</strong> Human errors in date recording that could lead to double-booking the same hall.</li>
    <li><strong>Weak Marketing for Owners:</strong> Difficulty for new hall owners and service providers to reach their target customers.</li>
</ul>

<h3>✨ Key Features</h3>

<h4>🔐 1. Advanced Role-Based Authentication</h4>
<ul>
    <li><strong>5 Roles with Custom Permissions:</strong>
        <ul>
            <li><strong>Admin:</strong> Full system control — managing users, halls, complaints, and statistics.</li>
            <li><strong>Owner:</strong> Manage their halls, set prices, and receive booking requests.</li>
            <li><strong>Service Provider:</strong> Offer complementary services like photography and event planning.</li>
            <li><strong>Client:</strong> Browse halls, use smart filters, book, rate, and pay.</li>
            <li><strong>Guest:</strong> Explore halls and pricing without creating an account.</li>
        </ul>
    </li>
    <li><strong>Biometric Authentication:</strong> Instant, secure login with fingerprint or face ID (FaceID/TouchID) and encrypted session storage via Flutter Secure Storage.</li>
</ul>

<ul>
    <li><strong>For Admin:</strong> Live interactive charts showing total users, active halls, booking growth rates, and resolved complaints.</li>

</ul>

                    const thumbSlides = galleryThumbs.querySelectorAll('.swiper-slide');
                    if (thumbSlides[slidesPerView - 1]) {
                        const overlay = document.createElement('div');
                        overlay.className = 'more-images-overlay';
                        overlay.innerText = '+' + hiddenCount;
                        thumbSlides[slidesPerView - 1].appendChild(overlay);
                    }
                }
            }

            // Initialize Thumbs Swiper
            var swiperThumbs = new Swiper(".gallery-thumbs", {
                spaceBetween: 10,
                slidesPerView: 6, // Increased to make thumbnails smaller
                freeMode: true,
                watchSlidesProgress: true,
                pagination: {
                    el: ".swiper-pagination",
                    type: "fraction",
                },
                breakpoints: {
                    320: {
                        slidesPerView: 4,
                        spaceBetween: 5
                    },
                    640: {
                        slidesPerView: 5,
                        spaceBetween: 8
                    },
                    1024: {
                        slidesPerView: 6,
                        spaceBetween: 10
                    }
                },
                on: {
                    init: function () {
                        setTimeout(updateHiddenImagesIndicator, 100);
                    },
                    resize: function () {
                        setTimeout(updateHiddenImagesIndicator, 100);
                    }
                }
            });

            // Initialize Main Swiper linked to Thumbs
            var swiperTop = new Swiper(".gallery-top", {
                spaceBetween: 10,
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                thumbs: {
                    swiper: swiperThumbs,
                },
                autoplay: { delay: 3000 },
                loop: true
            });
        }

        // Lightbox Functions
        const modal = document.getElementById("lightbox-modal");
        const modalImg = document.getElementById("lightbox-img");
        const closeBtn = document.getElementsByClassName("close-lightbox")[0];

        function openLightbox(src) {
            modal.style.display = "flex";
            modalImg.src = src;
        }

        closeBtn.onclick = function () {
            modal.style.display = "none";
        }

        modal.onclick = function (e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>

</html>
